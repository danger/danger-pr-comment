name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (MAJOR.MINOR.PATCH). Leave blank to release the version in version.rb.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: dblock/ruby-gem-release/.github/workflows/release.yml@v0.5.0
    with:
      ruby-version: '3.3'
      version: ${{ inputs.version }}
